name: Build IPS Patch

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ips:
    runs-on: ubuntu-latest

    steps:
      - name: Systempakete aktualisieren
        run: |
          sudo apt update
          sudo apt -y install make g++ flex bison git python-is-python3 python3-pip pkg-config libpng-dev
          sudo pip install pypng

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: RGBDS auschecken
        uses: actions/checkout@v7
        with:
          repository: gbdev/rgbds
          path: rgbds
          ref: 'v0.4.0'

      - name: RGBDS bauen und installieren
        run: |
          cd rgbds
          make Q= LDFLAGS="-Wl,--allow-multiple-definition"
          sudo make install

      - name: Decrypt base ROM
        env:
          BASE_ROM_PASSPHRASE: ${{ secrets.BASE_ROM_PASSPHRASE }}
        run: |
          if [ -z "$BASE_ROM_PASSPHRASE" ]; then
            echo "Missing secret BASE_ROM_PASSPHRASE"
            exit 1
          fi
          gpg --batch --yes --passphrase "$BASE_ROM_PASSPHRASE" \
            -o baserom.gbc -d baserom.gbc.gpg

      - name: Build ROM (target)
        run: |
          make -j$(nproc) --output-sync=target all

      - name: Verify ROM files exist
        run: |
          test -f baserom.gbc
          test -f pokegold97.gbc
          test -f pokesilver97.gbc

      - name: Build floating IPS (flips)
        run: |
          git clone --depth 1 https://github.com/Alcaro/Flips.git flips
          cd flips
          TARGET=cli make

      - name: Create IPS patch
        run: |
          mkdir -p dist
          ./flips/flips --create --ips baserom.gbc pokegold97.gbc dist/Gold_97_Reforged_German.ips
          ./flips/flips --create --ips baserom.gbc pokesilver97.gbc dist/Silver_97_Reforged_German.ips

      - name: Build BPS patch
        run: |
          ./flips/flips --create --bps baserom.gbc pokegold97.gbc dist/Gold_97_Reforged_German.bps
          ./flips/flips --create --bps baserom.gbc pokesilver97.gbc dist/Silver_97_Reforged_German.bps

      - name: Upload patch artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gold-silver-97-reforged-german-ips
          path: |
            dist/*.ips
            dist/*.bps

      - name: Upload IPS to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ips
            dist/*.bps