name: Build Gold/Silver 97 Reforged German

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Systempakete aktualisieren
        run: |
          sudo apt update
          sudo apt -y install make g++ flex bison git python-is-python3 python3-pip pkg-config libpng-dev
          sudo pip install pypng

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: RGBDS auschecken
        uses: actions/checkout@v4
        with:
          repository: gbdev/rgbds
          path: rgbds
          ref: 'v0.4.0'

      - name: RGBDS bauen und installieren
        run: |
          cd rgbds
          make Q= LDFLAGS="-Wl,--allow-multiple-definition"
          sudo make install

      - name: Gold ROM bauen
        run: |
          make -j$(nproc) -k --output-sync=target all
        working-directory: .

      - name: Freier Speicherplatz prüfen
        run: |
          sudo awk -f tools/free_space.awk pokegold97.map

      - name: Bank- und Section-Report mit Include-Breakdown
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          from collections import defaultdict
          import os

          MAPFILE = "pokegold97.map"
          SCRIPTSFILE = "data/maps/scripts.asm"
          NUM_BANKS = 0x80
          BANK_SIZE = 0x4000

          # Parse .map für Section-Grenzen
          bank_re = re.compile(r'^(ROM0 bank|ROMX bank) #(\d+):')
          sec_re = re.compile(r'^\s*SECTION:\s+\$([0-9A-Fa-f]{4})(?:-\$([0-9A-Fa-f]{4}))?.*\["(.*)"\]')

          sections = defaultdict(list)
          cur_bank = None

          try:
              with open(MAPFILE, "r", encoding="utf-8") as f:
                  for line in f:
                      m = bank_re.match(line)
                      if m:
                          cur_bank = int(m.group(2))
                          continue
                      if cur_bank is None:
                          continue
                      s = sec_re.match(line)
                      if s:
                          beg = int(s.group(1), 16)
                          end = int(s.group(2), 16) if s.group(2) else beg
                          name = s.group(3)
                          size = end - beg + 1
                          sections[cur_bank].append((beg, end, name, size))
          except FileNotFoundError:
              print("❌ pokegold97.map nicht gefunden")
              exit(1)

          # Parse scripts.asm für INCLUDE-Reihenfolge pro Section
          section_includes = defaultdict(list)
          current_section = None
          include_re = re.compile(r'INCLUDE\s+"maps/(.+?\.asm)"')
          section_header_re = re.compile(r'SECTION\s+"(.+?)"\s*,\s*ROMX')

          try:
              with open(SCRIPTSFILE, "r", encoding="utf-8") as f:
                  for line in f:
                      sh = section_header_re.search(line)
                      if sh:
                          current_section = sh.group(1)
                          section_includes[current_section] = []
                          continue
                      if current_section:
                          inc = include_re.search(line)
                          if inc:
                              section_includes[current_section].append(inc.group(1))
          except FileNotFoundError:
              pass

          # Ausgabe
          print("## 📊 Bank- und Section-Report")
          print()

          for b in range(NUM_BANKS):
              sec = sorted(sections.get(b, []), key=lambda x: x[0])
              if not sec:
                  continue
              
              used = sum(size for _, _, _, size in sec)
              free = BANK_SIZE - used
              pct = (used / BANK_SIZE) * 100 if BANK_SIZE else 0
              
              # Status-Icon
              status = "🔴" if free < 0 else "🟠" if free < 512 else "🟢"
              
              # Ausklappbar nach Bank
              print(f"<details>")
              print(f"<summary>{status} <strong>Bank ${b:02X}</strong> — {pct:.1f}% ({used:5d}/${BANK_SIZE} bytes) | free: {free:5d}</summary>")
              print()
              
              for beg, end, sec_name, sec_size in sec:
                  includes = section_includes.get(sec_name, [])
                  
                  if includes:
                      # Ausklappbar nach Section
                      print(f"<details>")
                      print(f"<summary><code>${beg:04X}-${end:04X}</code> — <strong>{sec_name}</strong> ({sec_size} bytes)</summary>")
                      print()
                      
                      # Include-Liste mit Größen
                      size_per = sec_size // len(includes) if includes else 0
                      rem = sec_size % len(includes) if includes else 0
                      for i, inc_name in enumerate(includes):
                          inc_size = size_per + (1 if i < rem else 0)
                          print(f"  - `{inc_name}` — {inc_size} bytes (${inc_size:04X})")
                      
                      print()
                      print(f"</details>")
                      print()
                  else:
                      # Section ohne Includes (z.B. ROM0 Sections)
                      print(f"- <code>${beg:04X}-${end:04X}</code> — **{sec_name}** ({sec_size} bytes)")
                      print()
              
              print(f"</details>")
              print()
          PY

      - name: Dateien hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon_g97r
          path: |
            *.gbc
            *.map