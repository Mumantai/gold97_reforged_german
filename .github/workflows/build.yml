name: Build Gold/Silver 97 Reforged German

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Systempakete aktualisieren
        run: |
          sudo apt update
          sudo apt -y install make g++ flex bison git python-is-python3 python3-pip pkg-config libpng-dev
          sudo pip install pypng

      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: RGBDS auschecken
        uses: actions/checkout@v4
        with:
          repository: gbdev/rgbds
          path: rgbds
          ref: 'v0.4.0'

      - name: RGBDS bauen und installieren
        run: |
          cd rgbds
          make Q= LDFLAGS="-Wl,--allow-multiple-definition"
          sudo make install

      - name: Gold ROM bauen
        run: |
          make -j$(nproc) -k --output-sync=target all
        working-directory: .

      - name: Freier Speicherplatz prüfen
        run: |
          sudo awk -f tools/free_space.awk pokegold97.map

      - name: Bank- und Section-Report erzeugen
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import re
          from collections import defaultdict

          MAPFILE = "pokegold97.map"
          NUM_BANKS = 0x80
          BANK_SIZE = 0x4000

          bank_re = re.compile(r'^(ROM0 bank|ROMX bank) #(\d+):')
          sec_re = re.compile(r'^\s*SECTION:\s+\$([0-9A-Fa-f]{4})(?:-\$([0-9A-Fa-f]{4}))?.*\["(.*)"\]')

          sections = defaultdict(list)
          cur_bank = None

          with open(MAPFILE, "r", encoding="utf-8") as f:
              for line in f:
                  m = bank_re.match(line)
                  if m:
                      cur_bank = int(m.group(2))
                      continue
                  if cur_bank is None:
                      continue
                  s = sec_re.match(line)
                  if s:
                      beg = int(s.group(1), 16)
                      end = int(s.group(2), 16) if s.group(2) else beg
                      name = s.group(3)
                      sections[cur_bank].append((beg, end, name))

          print("## Bank- und Section-Report")
          print()
          for b in range(NUM_BANKS):
              sec = sorted(sections.get(b, []), key=lambda x: x[0])
              used = sum(e - a + 1 for a, e, _ in sec)
              free = BANK_SIZE - used
              print(f"### Bank ${b:02X}")
              print(f"- used: {used:5d} (${used:04X})")
              print(f"- free: {free:5d} (${free:04X})")
              print(f"- sections: {len(sec)}")
              print()
              for a, e, name in sec:
                  print(f"- ${a:04X}-${e:04X} — {name}")
              print()
          PY

      - name: Dateien hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pokemon_g97r
          path: |
            *.gbc
            *.map